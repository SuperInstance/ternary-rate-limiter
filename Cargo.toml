[package]
name = "ternary-rate-limiter"
version = "0.1.0"
edition = "2021"
description = "Rate limiter for GPU kernel submissions with ternary feedback. Too fast = -1 (throttle), normal = 0, room available = +1 (speed up). Token bucket with ternary signals."
